name: Python tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile all Python files
        run: python -m compileall -q custom_components tests
      - name: Validate integration metadata
        run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('custom_components').rglob('*.json')]; json.loads(pathlib.Path('hacs.json').read_text())"
      - name: Run tests
        run: python -m unittest discover -s tests -v
